<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>كلية تمريض بنها</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, "Tahoma", sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 10%, #dff3ff 0%, transparent 30%),
        radial-gradient(circle at 90% 90%, #d8edff 0%, transparent 35%),
        linear-gradient(135deg, #f8fcff, #edf7ff);

      display: flex;
      justify-content: center;
      align-items: center;

      color: #17384f;
      overflow: hidden;
    }

    /* الخلفية */

    .bubble {
      position: fixed;
      border-radius: 50%;
      background: rgba(71, 170, 225, 0.12);
      filter: blur(1px);
      z-index: -1;
    }

    .bubble1 {
      width: 180px;
      height: 180px;
      top: -70px;
      left: -70px;
    }

    .bubble2 {
      width: 220px;
      height: 220px;
      bottom: -100px;
      right: -80px;
    }

    /* الحاوية */

    .container {
      width: 90%;
      max-width: 430px;
      text-align: center;
    }

    /* الشعار */

    .logo {
      width: 105px;
      height: 105px;

      margin: 0 auto 20px;

      border-radius: 32px;

      background: rgba(255,255,255,0.85);

      border: 1px solid rgba(180,220,240,0.8);

      box-shadow:
        0 20px 45px rgba(40,120,170,0.15);

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 52px;

      animation: logoAppear 0.8s ease;
    }

    @keyframes logoAppear {
      from {
        opacity: 0;
        transform: scale(.7) translateY(-20px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    /* العنوان */

    h1 {
      font-size: 30px;
      color: #07547d;
      margin-bottom: 8px;

      animation: fadeUp .8s ease;
    }

    .subtitle {
      color: #7892a5;
      font-size: 14px;
      margin-bottom: 30px;

      animation: fadeUp 1s ease;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* الكارت */

    .card {
      background: rgba(255,255,255,0.72);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border: 1px solid rgba(255,255,255,0.9);

      border-radius: 30px;

      padding: 25px;

      box-shadow:
        0 20px 50px rgba(30,100,150,0.12);

      animation: cardAppear 1s ease;
    }

    @keyframes cardAppear {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* اللينكات */

    .link {
      text-decoration: none;

      display: flex;
      align-items: center;

      width: 100%;

      padding: 16px;

      margin-bottom: 15px;

      border-radius: 20px;

      background: rgba(255,255,255,0.9);

      border: 1px solid #dcecf6;

      color: #17384f;

      box-shadow:
        0 8px 20px rgba(40,110,150,0.07);

      transition: .25s ease;
    }

    .link:last-child {
      margin-bottom: 0;
    }

    .link:hover {
      transform: translateY(-4px);

      box-shadow:
        0 14px 28px rgba(40,110,150,0.14);
    }

    .link:active {
      transform: scale(.97);
    }

    /* الأيقونة */

    .icon {
      width: 52px;
      height: 52px;

      min-width: 52px;

      border-radius: 16px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 27px;

      margin-left: 14px;
    }

    .whatsapp {
      background: #e8fff1;
    }

    .facebook {
      background: #eaf2ff;
    }

    /* النص */

    .text {
      text-align: right;
      flex: 1;
    }

    .text strong {
      display: block;

      font-size: 16px;

      margin-bottom: 5px;
    }

    .text span {
      font-size: 12px;

      color: #8aa0b0;
    }

    /* السهم */

    .arrow {
      font-size: 25px;

      color: #86a6ba;

      transition: .2s;
    }

    .link:hover .arrow {
      transform: translateX(-5px);
    }

    /* الفوتر */

    footer {
      margin-top: 22px;

      font-size: 11px;

      color: #91a7b6;
    }

    /* الموبايل */

    @media (max-width: 380px) {

      h1 {
        font-size: 26px;
      }

      .logo {
        width: 90px;
        height: 90px;
        font-size: 44px;
      }

      .card {
        padding: 20px;
      }

    }

  </style>
</head>

<body>

  <div class="bubble bubble1"></div>
  <div class="bubble bubble2"></div>

  <div class="container">

    <!-- الشعار -->
    <div class="logo">
      🩺
    </div>

    <!-- اسم الكلية -->
    <h1>كلية تمريض بنها</h1>

    <div class="subtitle">
      Banha Faculty of Nursing
    </div>


    <!-- اللينكات -->
    <div class="card">

      <!-- واتساب -->
      <a
        class="link"
        href="https://chat.whatsapp.com/GPwI4UUiQ9RH2fPuS6hWxQ?s=qt&p=a&mlu=4"
        target="_blank"
      >

        <div class="icon whatsapp">
          💬
        </div>

        <div class="text">
          <strong>جروب الواتساب</strong>
          <span>انضم للجروب وتابع كل جديد</span>
        </div>

        <div class="arrow">
          ‹
        </div>

      </a>


      <!-- فيسبوك -->
      <a
        class="link"
        href="https://www.facebook.com/B.N.S.U2?mibextid=ZbWKwL"
        target="_blank"
      >

        <div class="icon facebook">
          📘
        </div>

        <div class="text">
          <strong>صفحة الفيسبوك</strong>
          <span>تابع آخر الأخبار والإعلانات</span>
        </div>

        <div class="arrow">
          ‹
        </div>

      </a>

    </div>


    <footer>
      أحــمــد أيــمــن • 
      Nursing Banha
    </footer>

  </div>

</body>
</html>
